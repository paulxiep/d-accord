[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daccord-training-env"
version = "0.0.0"
description = "Tier-10A/11 QLoRA small-run trainer for Qwen3-8B (the M3 gate), reused for the tier-12A full train. Isolated env: heavy torch + peft + trl deps live here so the shared daccord venv stays slim. GPU service (RTX 5080, CUDA 12.8). See docs/m3_gate.md."
requires-python = ">=3.14,<3.15"
dependencies = [
    "daccord",
    # Match envs/baseline/ + consumer/ pins so the M3 adapter trains and
    # reloads (LocalAdapterClient) under identical torch/transformers/bnb —
    # apples-to-apples with the M0 baseline and the M4 fine-tune delta.
    "torch>=2.7,<3",
    "transformers>=5.9,<6",
    "peft>=0.19,<1",
    "bitsandbytes>=0.49,<1",
    "accelerate>=1.2,<2",
    # Trainer + chat-template completion-only masking (assistant_only_loss,
    # which auto-patches the Qwen3 chat template in trl v1.x). Latest stable
    # verified 2026-06-06: trl 1.5.1 (v1.0 landed 2026-03); trl 1.5 requires
    # datasets>=4.7 (resolver-confirmed at first sync).
    "trl>=1.5,<2",
    "datasets>=4.7,<5",
    # mlflow is pulled transitively via daccord; report_to=["mlflow"] uses it.
]

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.uv]
package = false

[tool.uv.sources]
daccord = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../src"]
addopts = "-q"
